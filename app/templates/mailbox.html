{% extends "base.html" %}

{% block content %}
<section class="card">
  <div class="mailbox-live-toolbar" data-mailbox-loading-indicator hidden>
    <span class="mailbox-loader-spinner" aria-hidden="true"></span>
    <span>正在获取新邮件…</span>
  </div>
  <div
    id="mailbox-live-region"
    data-mailbox-live-region
    data-fragment-url="{{ request.url_for('mailbox_fragment', access_key=access_key) }}"
    data-poll-interval-ms="{{ mailbox_poll_interval_ms }}"
  >
    {% include "mailbox_content.html" %}
  </div>
</section>

<script>
  (() => {
    const region = document.querySelector('[data-mailbox-live-region]');
    const loadingIndicator = document.querySelector('[data-mailbox-loading-indicator]');
    if (!region) return;

    const fragmentUrl = region.dataset.fragmentUrl;
    const interval = Number(region.dataset.pollIntervalMs || '10000');
    if (!fragmentUrl || interval <= 0) return;

    let refreshing = false;

    const setLoading = (loading) => {
      if (!loadingIndicator) return;
      loadingIndicator.hidden = !loading;
    };

    const refreshMailbox = async () => {
      if (refreshing) return;
      refreshing = true;
      setLoading(true);
      try {
        const response = await fetch(fragmentUrl, {
          headers: { 'X-Requested-With': 'mailbox-live-refresh' },
          cache: 'no-store',
        });
        const html = await response.text();
        region.innerHTML = html;
      } catch (error) {
        console.warn('mailbox refresh failed', error);
      } finally {
        setLoading(false);
        refreshing = false;
      }
    };

    window.setInterval(refreshMailbox, interval);
  })();
</script>
{% endblock %}
