{% extends "base.html" %}

{% block content %}
<section class="card border border-base-300 bg-base-100">
  <div class="card-body">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h2 class="card-title text-2xl">注册工作台</h2>
      <p class="mt-2 text-sm text-base-content/60">按使用状态和标签领取邮箱，成功接码后追加平台标签，不覆盖原有使用历史。</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <a class="btn btn-ghost btn-sm" href="/admin/cards">兑换卡管理</a>
      <a class="btn btn-ghost btn-sm" href="/admin/tags">标签管理</a>
      <a class="btn btn-ghost btn-sm" href="/admin/api">API 文档与调试</a>
      <a class="btn btn-ghost btn-sm" href="/admin">返回后台</a>
      <form method="post" action="/admin/logout">
        <button type="submit" class="btn btn-ghost btn-sm">退出登录</button>
      </form>
    </div>
  </div>

  <div class="mt-5 grid gap-4 lg:grid-cols-4 lg:items-start">
    <label class="grid gap-2 lg:col-span-2">
      <span class="text-sm font-medium">来源标签</span>
      <select class="select select-bordered w-full" data-workbench-category>
        <option value="">全部可用邮箱</option>
        {% for category_name in categories %}
          <option value="{{ category_name }}">{{ category_name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="grid gap-2 lg:col-span-2">
      <span class="text-sm font-medium">本次接码平台</span>
      <select class="select select-bordered w-full" data-workbench-target-tag required aria-required="true">
        <option value="" selected disabled>请选择平台标签</option>
        {% for tag in platform_tags %}
          <option value="{{ tag.id }}" data-tag-name="{{ tag.name }}">{{ tag.name }}</option>
        {% endfor %}
      </select>
      <span class="text-xs text-base-content/50">成功获取验证码后自动追加此平台标签，不覆盖邮箱已有标签。</span>
    </label>
    <fieldset class="rounded-box border border-base-300 p-3 lg:col-span-2" data-workbench-address-modes>
      <legend class="px-2 text-sm font-medium">邮箱方式</legend>
      <div class="flex flex-wrap gap-4">
        <label class="label cursor-pointer justify-start gap-2"><input class="radio radio-sm" type="radio" name="workbench_address_mode" value="primary" checked><span>固定邮箱</span></label>
        <label class="label cursor-pointer justify-start gap-2"><input class="radio radio-sm" type="radio" name="workbench_address_mode" value="icloud_alias"><span>iCloud 裂变邮箱</span></label>
      </div>
      <p class="mt-1 text-xs text-base-content/50">只有裂变模式允许同一主邮箱再次用于相同平台，每次都会生成全新地址。</p>
    </fieldset>
    <label class="flex cursor-pointer items-start gap-3 rounded-box border border-base-300 p-3 lg:col-span-2">
      <input class="checkbox checkbox-primary mt-0.5" type="checkbox" data-workbench-private>
      <span><strong class="block text-sm">禁止进入可复用邮箱池</strong><span class="mt-1 block text-xs text-base-content/50">成功接码后锁定整个邮箱族；如果邮箱已有使用历史，则记为“停止复用”，不会标记为隐私独立邮箱。</span></span>
    </label>
    <div class="flex flex-wrap gap-2 lg:col-span-4">
      <button type="button" class="btn btn-outline" data-claim-next>领取邮箱</button>
      <button type="button" class="btn btn-outline" data-refresh-mailbox>刷新验证码</button>
    </div>
  </div>

  <div class="alert mt-5" data-workbench-message>请选择来源标签和本次接码平台后领取邮箱。</div>
  </div>
</section>

<section class="card border border-base-300 bg-base-100" data-current-panel hidden>
  <div class="card-body">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h2 class="card-title text-2xl">当前邮箱</h2>
      <p class="mt-2 text-sm text-base-content/60">状态：<span class="badge badge-outline" data-current-status>未领取</span></p>
    </div>
    <a class="btn btn-outline btn-sm" data-open-mailbox target="_blank" rel="noreferrer">打开完整前台</a>
  </div>

  <div class="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-6">
    <div class="grid gap-1 lg:col-span-2">
      <span class="text-xs font-medium text-base-content/50">注册邮箱</span>
      <strong class="break-words" data-current-email></strong>
    </div>
    <div class="grid gap-1">
      <span class="text-xs font-medium text-base-content/50">查看 Key</span>
      <code class="kbd kbd-sm w-fit" data-current-key></code>
    </div>
    <div class="grid gap-1">
      <span class="text-xs font-medium text-base-content/50">CloudMail 查询邮箱</span>
      <code class="kbd kbd-sm w-fit" data-current-query-email></code>
    </div>
    <div class="grid gap-1">
      <span class="text-xs font-medium text-base-content/50">最新验证码</span>
      <button type="button" class="inline-flex h-8 w-fit items-center justify-center rounded-field border border-error/40 bg-white px-3 font-mono text-sm font-bold tracking-wider text-error shadow-sm transition-colors hover:border-error hover:bg-white hover:text-error focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-error disabled:cursor-default disabled:opacity-60" data-current-code disabled>等待验证码…</button>
    </div>
    <div class="grid min-w-0 gap-1" data-current-meta-wrap>
      <span class="text-xs font-medium text-base-content/50">备注 / 标签</span>
      <span class="block min-w-0 max-w-full truncate" data-current-meta></span>
    </div>
  </div>

  <div class="mt-5 flex flex-wrap gap-2">
    <button type="button" class="btn btn-outline" data-copy-email>复制邮箱</button>
    <button type="button" class="btn btn-outline" data-copy-key>复制 Key</button>
    <button type="button" class="btn btn-outline" data-mark-used>确认接码并追加标签</button>
    <button type="button" class="btn btn-ghost" data-skip-current>跳过当前邮箱</button>
    <button type="button" class="btn btn-error btn-outline" data-void-current title="追加“邮箱作废”标签，并永久停止发放整个邮箱族">作废当前邮箱</button>
  </div>
  </div>
</section>

<div class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center px-4" aria-live="polite" aria-atomic="true">
  <div class="max-w-sm translate-y-2 rounded-full border border-base-100/20 bg-base-content/80 px-4 py-2 text-sm text-base-100 opacity-0 shadow-lg backdrop-blur-sm transition duration-200 ease-out" data-copy-toast aria-hidden="true">
    验证码已复制
  </div>
</div>

<script>
  (() => {
    const PRIVATE_PREFERENCE_KEY = 'cloudmail-workbench-private-v1';
    const pollInterval = Number('{{ workbench_poll_interval_ms }}');
    const categoryInput = document.querySelector('[data-workbench-category]');
    const targetTagInput = document.querySelector('[data-workbench-target-tag]');
    const privateEmailInput = document.querySelector('[data-workbench-private]');
    const primaryModeInput = document.querySelector('input[name="workbench_address_mode"][value="primary"]');
    const aliasModeInput = document.querySelector('input[name="workbench_address_mode"][value="icloud_alias"]');
    const messageBox = document.querySelector('[data-workbench-message]');
    const currentPanel = document.querySelector('[data-current-panel]');
    const currentStatus = document.querySelector('[data-current-status]');
    const currentEmail = document.querySelector('[data-current-email]');
    const currentKey = document.querySelector('[data-current-key]');
    const currentQueryEmail = document.querySelector('[data-current-query-email]');
    const currentCode = document.querySelector('[data-current-code]');
    const currentMeta = document.querySelector('[data-current-meta]');
    const openMailbox = document.querySelector('[data-open-mailbox]');
    const claimNextButton = document.querySelector('[data-claim-next]');
    const refreshMailboxButton = document.querySelector('[data-refresh-mailbox]');
    const markUsedButton = document.querySelector('[data-mark-used]');
    const skipCurrentButton = document.querySelector('[data-skip-current]');
    const voidCurrentButton = document.querySelector('[data-void-current]');
    const copyToast = document.querySelector('[data-copy-toast]');

    let currentMapping = null;
    let hasClaimedInPage = false;
    let actionPending = false;
    let claimPendingLabel = '';
    let poller = null;
    let copyToastTimer = null;

    const readPrivatePreference = () => {
      try { return window.localStorage.getItem(PRIVATE_PREFERENCE_KEY) === 'true'; }
      catch (_error) { return false; }
    };

    const applyPrivatePreference = (persist = false) => {
      if (persist) {
        try { window.localStorage.setItem(PRIVATE_PREFERENCE_KEY, privateEmailInput?.checked ? 'true' : 'false'); }
        catch (_error) { /* 浏览器禁用本地存储时仍可继续当前操作。 */ }
      }
      const currentIsAlias = currentMapping?.address_kind === 'icloud_alias';
      if (privateEmailInput?.checked && !currentIsAlias && primaryModeInput) primaryModeInput.checked = true;
      if (aliasModeInput) aliasModeInput.disabled = Boolean(privateEmailInput?.checked && !currentIsAlias);
    };

    if (privateEmailInput) privateEmailInput.checked = readPrivatePreference();
    applyPrivatePreference();

    const setMessage = (message, type = '') => {
      messageBox.textContent = message || '';
      messageBox.className = 'alert border border-base-content/20';
    };

    const showCopyToast = (message) => {
      if (!copyToast) return;
      if (copyToastTimer) window.clearTimeout(copyToastTimer);
      copyToast.textContent = message;
      copyToast.setAttribute('aria-hidden', 'false');
      copyToast.classList.remove('translate-y-2', 'opacity-0');
      copyToast.classList.add('translate-y-0', 'opacity-90');
      copyToastTimer = window.setTimeout(() => {
        copyToast.classList.remove('translate-y-0', 'opacity-90');
        copyToast.classList.add('translate-y-2', 'opacity-0');
        copyToast.setAttribute('aria-hidden', 'true');
        copyToastTimer = null;
      }, 1600);
    };

    const truncateMetaPart = (value, maxLength = 16) => {
      const normalized = String(value || '').trim();
      return normalized.length > maxLength ? `${normalized.slice(0, maxLength)}…` : normalized;
    };

    const setLatestCode = (code = '', emptyLabel = '等待验证码…') => {
      const normalizedCode = String(code || '').trim();
      currentCode.textContent = normalizedCode || emptyLabel;
      currentCode.dataset.copyCode = normalizedCode;
      currentCode.disabled = !normalizedCode;
      currentCode.setAttribute(
        'aria-label',
        normalizedCode ? `复制最新验证码 ${normalizedCode}` : emptyLabel,
      );
    };

    const syncActionState = () => {
      const hasCurrent = Boolean(currentMapping);
      const hasCode = Boolean(currentCode?.dataset.copyCode);
      if (claimNextButton) {
        claimNextButton.disabled = actionPending || hasCurrent;
        claimNextButton.textContent = claimPendingLabel || (
          hasCurrent ? '请先处理当前邮箱' : (hasClaimedInPage ? '领取下一个' : '领取邮箱')
        );
      }
      if (markUsedButton) markUsedButton.disabled = actionPending || !hasCurrent || !hasCode;
      if (skipCurrentButton) skipCurrentButton.disabled = actionPending || !hasCurrent;
      if (voidCurrentButton) voidCurrentButton.disabled = actionPending || !hasCurrent;
      if (refreshMailboxButton) refreshMailboxButton.disabled = actionPending || !hasCurrent;
    };

    const formData = (extra = {}) => {
      const data = new FormData();
      data.set('category', categoryInput?.value || '');
      data.set('target_tag_id', targetTagInput?.value || '');
      data.set('address_mode', document.querySelector('input[name="workbench_address_mode"]:checked')?.value || 'primary');
      data.set('prevent_shared_pool', privateEmailInput?.checked ? 'true' : 'false');
      Object.entries(extra).forEach(([key, value]) => data.set(key, value));
      return data;
    };

    const requestJson = async (url, options = {}) => {
      const response = await fetch(url, {
        cache: 'no-store',
        headers: { 'X-Requested-With': 'workbench' },
        ...options,
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.message || payload.error || '请求失败');
      }
      return payload;
    };

    const copyText = async (value) => {
      if (!value) return;
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const fallback = document.createElement('textarea');
      fallback.value = value;
      fallback.setAttribute('readonly', 'readonly');
      fallback.setAttribute('aria-hidden', 'true');
      fallback.className = 'fixed left-0 top-0 opacity-0';
      document.body.appendChild(fallback);
      fallback.select();
      document.execCommand('copy');
      fallback.remove();
    };

    const stopPolling = () => {
      if (poller) window.clearInterval(poller);
      poller = null;
    };

    const startPolling = () => {
      stopPolling();
      if (!currentMapping?.target_tag_id || pollInterval <= 0) return;
      poller = window.setInterval(refreshLatestCode, pollInterval);
    };

    const renderMapping = (mapping, restartPolling = true) => {
      currentMapping = mapping;
      if (!mapping) {
        currentPanel.hidden = true;
        if (targetTagInput) targetTagInput.disabled = false;
        applyPrivatePreference();
        setLatestCode();
        stopPolling();
        syncActionState();
        return;
      }

      hasClaimedInPage = true;
      currentPanel.hidden = false;
      if (mapping.address_kind === 'icloud_alias' && aliasModeInput) aliasModeInput.checked = true;
      else if (primaryModeInput) primaryModeInput.checked = true;
      applyPrivatePreference();
      if (targetTagInput) {
        const targetTagId = String(mapping.target_tag_id || '');
        const matchingOption = targetTagId
          ? Array.from(targetTagInput.options).find((option) => option.value === targetTagId)
          : Array.from(targetTagInput.options).find((option) => option.dataset.tagName === mapping.target_site);
        if (matchingOption) {
          targetTagInput.value = matchingOption.value;
          targetTagInput.disabled = true;
        } else {
          targetTagInput.value = '';
          targetTagInput.disabled = false;
        }
      }
      currentStatus.textContent = mapping.status_label || mapping.status || '';
      currentStatus.className = `badge ${mapping.status === 'in_progress' ? 'badge-warning' : 'badge-success'}`;
      currentEmail.textContent = mapping.recipient_email || '';
      currentKey.textContent = mapping.access_key || '';
      currentQueryEmail.textContent = mapping.query_email || '';
      const mappingTags = Array.isArray(mapping.tags)
        ? mapping.tags.map((tag) => typeof tag === 'string' ? tag : tag.name).filter(Boolean)
        : [];
      const fullMeta = [mapping.label, ...(mappingTags.length ? mappingTags : [mapping.category]), mapping.target_site].filter(Boolean).join(' / ');
      currentMeta.textContent = [
        truncateMetaPart(mapping.label),
        ...(mappingTags.length ? mappingTags : [mapping.category]),
        truncateMetaPart(mapping.target_site),
      ].filter(Boolean).join(' / ') || '未设置';
      currentMeta.title = fullMeta;
      openMailbox.href = mapping.mailbox_url || '#';
      setLatestCode();
      if (restartPolling) startPolling();
      syncActionState();
    };

    const renderLatestCode = (payload) => {
      if (!payload.mapping) {
        renderMapping(null);
        setMessage('当前领取已释放，请重新领取一个邮箱。');
        return;
      }
      const platformChanged = String(currentMapping?.target_tag_id || '') !== String(payload.mapping.target_tag_id || '');
      if (!currentMapping || currentMapping.id !== payload.mapping.id || currentMapping.status !== payload.mapping.status || platformChanged) {
        renderMapping(payload.mapping, false);
        if (platformChanged) startPolling();
      } else {
        currentMapping = payload.mapping;
      }
      setLatestCode(payload.latest_code, payload.error ? '获取失败' : '等待验证码…');
      syncActionState();
    };

    const loadCurrent = async () => {
      try {
        const category = encodeURIComponent(categoryInput?.value || '');
        const payload = await requestJson(`/api/workbench/current?category=${category}`);
        renderMapping(payload.mapping);
        setMessage(payload.message || '');
        if (payload.mapping?.target_tag_id) await refreshLatestCode();
      } catch (error) {
        setMessage(error.message, 'error');
      }
    };

    async function refreshLatestCode() {
      if (!currentMapping) return;
      if (!currentMapping.target_tag_id && !targetTagInput?.value) {
        setMessage('请先选择本次接码平台，再刷新验证码。', 'error');
        targetTagInput?.focus();
        return;
      }
      const requestedMappingId = currentMapping.id;
      try {
        const category = encodeURIComponent(categoryInput?.value || '');
        const targetTagId = targetTagInput?.value || '';
        const targetTagQuery = targetTagId ? `&target_tag_id=${encodeURIComponent(targetTagId)}` : '';
        const payload = await requestJson(`/api/workbench/current/mailbox?category=${category}${targetTagQuery}`);
        if (!currentMapping || currentMapping.id !== requestedMappingId) return;
        renderLatestCode(payload);
      } catch (error) {
        if (!currentCode.dataset.copyCode) {
          setLatestCode('', '获取失败');
          syncActionState();
        }
        if (!currentMapping?.target_tag_id) setMessage(error.message, 'error');
      }
    }

    const claimNext = async () => {
      if (currentMapping) {
        setMessage('请先在当前邮箱卡片中确认接码或跳过当前邮箱。', 'error');
        return;
      }
      if (!targetTagInput?.value) {
        setMessage('请先选择本次接码平台。', 'error');
        targetTagInput?.focus();
        return;
      }
      actionPending = true;
      claimPendingLabel = '领取中…';
      syncActionState();
      setMessage('正在领取邮箱…');

      try {
        const payload = await requestJson('/api/workbench/claim-next', {
          method: 'POST',
          body: formData(),
        });
        renderMapping(payload.mapping);
        setMessage(payload.message || '', payload.mapping ? 'success' : '');
        if (payload.mapping) await refreshLatestCode();
      } catch (error) {
        await loadCurrent();
        setMessage(error.message, 'error');
      } finally {
        actionPending = false;
        claimPendingLabel = '';
        syncActionState();
      }
    };

    const completeCurrent = async (url, actionButton, pendingLabel) => {
      if (!currentMapping) {
        setMessage('当前没有可处理的邮箱，请先领取一个。', 'error');
        return;
      }
      const isCompletion = url.endsWith('/mark-used');
      const isVoid = url.endsWith('/void');
      if (isCompletion && !targetTagInput?.value) {
        setMessage('请先选择本次接码平台。', 'error');
        targetTagInput?.focus();
        return;
      }

      if (isCompletion && !currentCode.dataset.copyCode) {
        setMessage('只有成功获取验证码后才能追加使用标签。', 'error');
        return;
      }
      const originalLabel = actionButton?.textContent || '';
      actionPending = true;
      syncActionState();
      if (actionButton) actionButton.textContent = pendingLabel;
      setMessage(
        isCompletion
          ? '正在记录成功接码并追加标签…'
          : (isVoid ? '正在作废当前邮箱并追加标签…' : '正在跳过当前邮箱…'),
      );

      try {
        const payload = await requestJson(url, {
          method: 'POST',
          body: formData({ mapping_id: String(currentMapping.id) }),
        });
        renderMapping(payload.mapping);
        setMessage(payload.message || '', payload.mapping ? 'success' : '');
        if (payload.mapping) {
          await refreshLatestCode();
        }
      } catch (error) {
        setMessage(error.message, 'error');
      } finally {
        if (actionButton) actionButton.textContent = originalLabel;
        actionPending = false;
        syncActionState();
      }
    };

    claimNextButton?.addEventListener('click', claimNext);
    refreshMailboxButton?.addEventListener('click', refreshLatestCode);
    document.querySelector('[data-copy-email]')?.addEventListener('click', async () => {
      await copyText(currentMapping?.recipient_email || '');
      setMessage('邮箱已复制', 'success');
    });
    document.querySelector('[data-copy-key]')?.addEventListener('click', async () => {
      await copyText(currentMapping?.access_key || '');
      setMessage('Key 已复制', 'success');
    });
    markUsedButton?.addEventListener('click', () => {
      completeCurrent('/api/workbench/current/mark-used', markUsedButton, '保存中…');
    });
    skipCurrentButton?.addEventListener('click', () => {
      completeCurrent('/api/workbench/current/skip', skipCurrentButton, '取消中…');
    });
    voidCurrentButton?.addEventListener('click', () => {
      if (!currentMapping) return;
      const confirmed = window.confirm(
        `确定作废 ${currentMapping.recipient_email || '当前邮箱'} 吗？\n\n系统会追加“邮箱作废”标签，并永久停止发放整个邮箱族。`,
      );
      if (confirmed) completeCurrent('/api/workbench/current/void', voidCurrentButton, '作废中…');
    });
    currentCode?.addEventListener('click', async () => {
      const code = currentCode.dataset.copyCode || '';
      if (!code) return;
      try {
        await copyText(code);
        showCopyToast('验证码已复制');
      } catch (error) {
        setMessage('验证码复制失败，请手动复制。', 'error');
      }
    });
    categoryInput?.addEventListener('change', loadCurrent);
    targetTagInput?.addEventListener('change', () => {
      if (currentMapping && !currentMapping.target_tag_id) refreshLatestCode();
    });
    privateEmailInput?.addEventListener('change', () => applyPrivatePreference(true));

    syncActionState();
    loadCurrent();
  })();
</script>
{% endblock %}
