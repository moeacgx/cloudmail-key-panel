{% extends "base.html" %}

{% block content %}
<section class="card mx-auto w-full max-w-xl border border-base-300 bg-base-100">
  <div class="card-body gap-5">
  <h2 class="card-title text-2xl">后台登录</h2>
  {% if error %}
    <div class="alert border border-base-content/20">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/login" class="grid gap-4">
    <label class="grid gap-2">
      <span class="text-sm font-medium">用户名</span>
      <input class="input input-bordered w-full" type="text" name="username" autocomplete="username" required>
    </label>
    <label class="grid gap-2">
      <span class="text-sm font-medium">密码</span>
      <input class="input input-bordered w-full" type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-outline">登录后台</button>
  </form>
  </div>
</section>
{% endblock %}
